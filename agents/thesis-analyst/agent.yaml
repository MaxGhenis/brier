# The Thesis analyst — versioned agent definition.
#
# This directory IS the agent: a thin generic harness (system.md) plus thick
# domain skills (skills/*.md). A run is parameterized ONLY by the question
# spec — series/concept, period, and optionally a policy conditional — never
# by bespoke per-cell instructions. Bump `version` whenever system.md, a
# skill, or this file changes; prediction runs record the version plus
# content hashes (promptHash = sha256(system.md), toolPolicyHash =
# sha256(concatenated skills, sorted by filename)) so every published
# forecast is attributable to an exact, reproducible agent.

name: thesis.analyst
version: 2.5.0
model: claude-fable-5

input:
  question_spec:
    series: Concept or series identifier (e.g. bls.cps.unemployment_rate, fns.snap.total_payment_error_rate)
    period: Target period (e.g. 2026-06, FY2025, week ending 2026-06-13)
    conditionalOn: Optional policy condition, ideally an Axiom provision reference (e.g. axiom:usc/42/1396w-9 or a reconciliation-act section); null for unconditional cells

output:
  contract: One JSON object per docs/cell-contract.md (the spawned-cell schema enforced by scripts/spawned_cells_to_ts.py and site/src/__tests__/trace-depth.test.ts)

quality:
  rubric: site/src/__tests__/trace-depth.test.ts
  honesty: Every tool-step result fetched this run; runAt is the real generation time; drop the cell rather than invent a number.
