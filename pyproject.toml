[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brier"
version = "0.2.4"
description = "Forecasting as a harness for decision-making"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Max Ghenis"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["forecasting", "decision-making", "calibration", "prediction"]
dependencies = []

[project.scripts]
brier = "brier.cli:main"
brier-mcp = "brier.mcp_server:main"

[project.urls]
Homepage = "https://brier.institute"
Documentation = "https://brier.institute/docs"
Repository = "https://github.com/ThesisInstitute/thesis"
Issues = "https://github.com/ThesisInstitute/thesis/issues"

[project.optional-dependencies]
custody = [
    "receipt==0.3.0; python_version >= '3.11'",
]
experiments = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "anthropic>=0.86.0",
    "openai>=2.29.0",
    "pandas>=2.3.3",
    "statsmodels>=0.14.6",
    "matplotlib>=3.10.8",
]
mcp = [
    "mcp[cli]>=1.26.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "black>=26.3.1",
    "ruff>=0.15.7",
    "pyyaml>=6.0.2",
]

[tool.setuptools.packages.find]
include = ["brier*"]

[tool.setuptools.package-data]
brier = [
    "assets/skills/codex/SKILL.md",
    "assets/skills/claude/SKILL.md",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I", "N", "W"]

[dependency-groups]
bills = [
    "httpx>=0.27",
    "pypdf>=5.1",
    "selectolax>=0.3.21",
]
