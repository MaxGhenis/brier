name: Record forecasts

# Daily timestamped snapshot of every published forecast surface, committed to
# git. Until the ledger database is live, the commit chain IS the proof that a
# prediction existed before its resolution date — recordedAt claims inside the
# app data are only as credible as this externally-timestamped record.

on:
  schedule:
    - cron: "17 14 * * *" # daily 14:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Snapshot published forecast surfaces
        run: |
          set -euo pipefail
          DAY=$(date -u +%F)
          DIR="records/$DAY"
          mkdir -p "$DIR/live"
          # The full published JSON regenerates deterministically from this
          # repo, so the daily record stores their sha256 (binding what the
          # PUBLIC site served to an external timestamp) plus a compact digest —
          # not the multi-MB bodies.
          # Surfaces must match what the deployed app serves; /specs.json was
          # retired 2026-06-30 for /targets.json (target architecture), which
          # broke this job for two days — see records/2026-06-30/GAP.md.
          declare -A SURFACES=(
            [log]="log.json"
            [ledger]="ledger.json"
            [targets]="targets.json"
            [reward]="brier/reward.json"
          )
          for f in "${!SURFACES[@]}"; do
            curl -sSf -m 60 "https://app.thesisinstitute.org/${SURFACES[$f]}" -o "/tmp/$f.json"
            python3 -m json.tool "/tmp/$f.json" > /dev/null
          done
          python3 - "$DIR" <<'PY'
          import hashlib, json, re, sys
          from pathlib import Path
          outdir = sys.argv[1]
          digest = {}
          # Chain this digest to the most recent prior day's, so the record
          # is a verifiable hash chain, not independent snapshots — see
          # scripts/verify_record_chain.py.
          prior = sorted(
              p for p in Path("records").iterdir()
              if p.is_dir() and re.fullmatch(r"\d{4}-\d{2}-\d{2}", p.name)
              and p.name < Path(outdir).name and (p / "digest.json").exists()
          )
          if prior:
              prev = prior[-1] / "digest.json"
              digest["chain"] = {
                  "prevDay": prior[-1].name,
                  "prevDigestSha256": hashlib.sha256(prev.read_bytes()).hexdigest(),
              }
          for name in ("log", "ledger", "targets", "reward"):
              raw = open(f"/tmp/{name}.json", "rb").read()
              digest[name] = {
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "bytes": len(raw),
              }
          log = json.load(open("/tmp/log.json"))
          entries = log.get("entries", [])
          recorded = [e for e in entries if e.get("kind") == "prediction_recorded"]
          resolved = [e for e in entries if e.get("kind") == "prediction_resolved"]
          digest["counts"] = {"recorded": len(recorded), "resolved": len(resolved)}
          digest["predictions"] = [
              {k: e.get(k) for k in ("forecastSlug", "pointEstimate", "interval80",
                                      "resolutionDate", "recordedAt")}
              for e in recorded
          ]
          digest["resolutions"] = resolved
          json.dump(digest, open(f"{outdir}/digest.json", "w"), indent=1, sort_keys=True)
          PY
          # Capture each live cell's streamed forecast event (full distribution).
          for slug in spm-child-poverty-2025 cpi-u-annual-2026 ctc-expansion-cost-ty2026 ctc-current-law-outlays-ty2026; do
            curl -sS -m 90 -N "https://api.thesisinstitute.org/forecasts/$slug/stream" \
              | awk '/^event: forecast$/{f=1;next} f&&/^data: /{print substr($0,7); exit}' \
              > "$DIR/live/$slug.json" || true
            [ -s "$DIR/live/$slug.json" ] || echo '{"error":"no forecast event captured"}' > "$DIR/live/$slug.json"
          done
          echo "{\"snapshotAt\": \"$(date -u +%FT%TZ)\"}" > "$DIR/meta.json"

      - name: Verify record chain
        run: python3 scripts/verify_record_chain.py records

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name "thesis-recorder"
          git config user.email "recorder@thesisinstitute.org"
          git add records/
          git commit -m "Record forecast surfaces $(date -u +%F) [skip ci]" || echo "nothing new to commit"
          git push origin main

      # The record chain is the integrity proof; a silent failure is a hole in
      # it (2026-06-30/07-01 went unrecorded for two days before anyone
      # noticed). File an issue so a broken run surfaces the same day.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Record forecasts failed $(date -u +%F)"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
          if [ -z "$existing" ]; then
            gh issue create --title "$title" \
              --body "The daily forecast-surface recorder failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Every unrecorded day is a gap in the pre-registration chain — fix the same day if possible."
          fi
