name: Records provenance

# Detective control: every commit touching records/** after the enforcement
# epoch must carry a Sigstore attestation from an allowlisted publishing
# workflow (see scripts/verify_records_attestations.py). Push runs check the
# pushed range; the daily audit re-walks epoch..HEAD, which also covers
# [skip ci] pushes that never trigger the push run.

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 15 * * *" # daily, after the 13:40 UTC resolution cycle
  workflow_dispatch:

permissions:
  contents: read
  attestations: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify records commit provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          EVENT_AFTER: ${{ github.event.after || '' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$EVENT_BEFORE" ] && [ -n "$EVENT_AFTER" ]; then
            python3 scripts/verify_records_attestations.py --range "$EVENT_BEFORE..$EVENT_AFTER"
          else
            python3 scripts/verify_records_attestations.py
          fi

      # A red audit means an unattested or mis-attested records push (or an
      # audit bug) — the 2026-07-31 failures ran silent for ninety minutes
      # because nothing alarmed. Same deduped-daily-issue pattern as CI.
      - name: Alert on main provenance failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Records provenance failed on main $(date -u +%F)"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'first(.[].number)' || true)
          if [ -z "$existing" ] || [ "$existing" = "null" ]; then
            gh issue create --title "$title" \
              --body "The records provenance audit is red on main: https://github.com/${GH_REPO}/actions/runs/${{ github.run_id }}. Every records/** commit must carry allowlisted workflow provenance — diagnose before more records land."
          fi
