name: Witness SBA PDF custody

# Capture the rolling SBA loan-performance bundle before the resolution and
# recorder backstops. Every sealed attempt is published first, then the
# recorder is dispatched explicitly so GitHub schedule delays cannot invert
# capture and witnessing.
on:
  schedule:
    - cron: "5 13 * * *" # daily 13:05 UTC, including weekends
  workflow_dispatch: {}

permissions:
  actions: write # dispatches the recorder after publishing the capture
  contents: write
  issues: write # surfaces a missed or refused custody poll the same day
  id-token: write # Sigstore attestation of the records push
  attestations: write

concurrency:
  group: witness-sba-pdf
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: astral-sh/setup-uv@v5
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Capture and verify the official SBA PDF bundle
        id: capture
        run: |
          set -euo pipefail
          MANIFEST=$(uv run --locked --extra custody python scripts/witness_sba_pdf.py \
            --records records)
          test -n "$MANIFEST" && test -f "$MANIFEST"
          RUN_DIR=$(MANIFEST="$MANIFEST" python3 - <<'PY'
          import os
          import pathlib
          import re

          root = pathlib.Path.cwd().resolve()
          manifest = pathlib.Path(os.environ["MANIFEST"]).resolve()
          if manifest.name != "manifest.json":
              raise SystemExit(f"capture did not return a manifest path: {manifest}")
          try:
              relative = manifest.parent.relative_to(root).as_posix()
          except ValueError as exc:
              raise SystemExit(f"capture escaped the checkout: {manifest}") from exc
          if not re.fullmatch(
              r"records/\d{4}-\d{2}-\d{2}/[^/]+-sba-pdf-witness", relative
          ):
              raise SystemExit(f"unexpected SBA witness run directory: {relative}")
          print(relative)
          PY
          )
          uv run --locked --extra custody python scripts/verify_custody.py "$RUN_DIR"
          OUTCOME=$(jq -er '.outcome | select(
            . == "bootstrap" or . == "changed" or
            . == "unchanged" or . == "failed"
          )' "$RUN_DIR/manifest.json")
          {
            echo "manifest=$RUN_DIR/manifest.json"
            echo "run_dir=$RUN_DIR"
            echo "outcome=$OUTCOME"
          } >> "$GITHUB_OUTPUT"

      - name: Commit the sealed SBA capture attempt
        run: |
          set -euo pipefail
          RUN_DIR="${{ steps.capture.outputs.run_dir }}"
          git config user.name "thesis-sba-witness"
          git config user.email "recorder@thesisinstitute.org"
          git add -- "$RUN_DIR"
          test -n "$(git diff --cached --name-only -- "$RUN_DIR")"
          if git diff --cached --name-only | grep -v "^$RUN_DIR/"; then
            echo "capture staged a path outside $RUN_DIR" >&2
            exit 1
          fi
          git commit -m "Witness SBA PDF bundle $(date -u +%F)"

      - name: Rebase, reverify, and push the capture
        id: capture_push
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DIR: ${{ steps.capture.outputs.run_dir }}
        run: |
          set -euo pipefail
          auth_helper="!f() { echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f"
          pushed=0
          for attempt in 1 2 3; do
            echo "SBA witness push attempt $attempt"
            test -z "$(git status --porcelain)"
            git pull --rebase origin main
            uv run --locked --extra custody python scripts/verify_custody.py "$RUN_DIR"
            uv run --locked --extra custody python scripts/verify_record_chain.py records
            git diff --exit-code
            git diff --cached --exit-code
            if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
              PUBLISHED=$(git log -1 --diff-filter=A --format=%H \
                origin/main -- "$RUN_DIR/manifest.json")
              if [ -n "$PUBLISHED" ] && git merge-base --is-ancestor \
                "$PUBLISHED" origin/main; then
                # A prior push may have reached GitHub even if the client lost
                # its success response. Attest the exact introducing commit.
                LOCAL="$PUBLISHED"
                pushed=1
                break
              fi
              echo "nothing of the SBA capture survived the rebase" >&2
              exit 1
            fi
            LOCAL=$(git rev-parse HEAD)
            if git -c credential.helper= -c credential.helper="$auth_helper" push origin main; then
              # Push success proves this commit reached main. A later writer
              # may advance the ref before the attestation step; the subject
              # remains this exact records-introducing commit.
              pushed=1
              break
            fi
            sleep 2
          done
          if [ "$pushed" != "1" ]; then
            echo "SBA witness push did not converge after 3 attempts" >&2
            exit 1
          fi
          echo "pushed_sha=$LOCAL" >> "$GITHUB_OUTPUT"

      - name: Attest the SBA capture push
        uses: ./.github/actions/attest-records-push
        with:
          commit: ${{ steps.capture_push.outputs.pushed_sha }}

      - name: Dispatch the recorder for the published attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run record-forecasts.yml --ref main

      # Failed source fetches are valid, custody-rooted records. Publish and
      # dispatch them first, then turn the workflow red so an irreversible
      # first-print gap cannot remain operationally silent.
      - name: Flag a sealed source failure
        if: steps.capture.outputs.outcome == 'failed'
        run: |
          echo "The sealed SBA source attempt failed; its recorder was dispatched." >&2
          exit 1

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="SBA PDF custody witness failed $(date -u +%F)"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
          if [ -z "$existing" ]; then
            gh issue create --title "$title" \
              --body "The daily SBA PDF custody workflow failed or recorded a sealed source refusal: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Inspect whether the attempt was published and witnessed; first-print custody may not have advanced."
          fi
