name: Roll the docket

# The compounding loop: preregister the next targets in privileged Git history,
# run the untrusted analyst pipeline at that exact ref, then publish only a
# validated data bundle. Idempotent when there is nothing to roll.

on:
  schedule:
    - cron: "30 16 * * 1,5" # Mon + Fri 16:30 UTC (after Thursday resolutions)
  workflow_dispatch:
    inputs:
      max_targets:
        description: "Cap on targets this run"
        default: "10"
      cadence:
        description: "weekly|monthly|quarterly|annual (empty = all)"
        default: ""
      series:
        description: "Roll only this exact registry series (empty = all)"
        default: ""
      prompt_mode:
        description: "Analyst prompt mode: fast|full|ladder"
        default: "fast"
      codex_model:
        description: "Codex model for the analyst (empty = pipeline default)"
        default: ""
      codex_reasoning_effort:
        description: "Codex reasoning effort (empty = pipeline default)"
        default: ""
      codex_network:
        description: >-
          "true" runs the analyst in a workspace-write sandbox with network
          access, for targets whose official endpoints the hosted web-search
          tool cannot fetch
        default: ""
      review_codex_model:
        description: "Pre-submit review model (empty = pipeline default)"
        default: ""
      review_codex_search:
        description: '"true" gives the pre-submit reviewer hosted web search'
        default: ""
      timeout_seconds:
        description: "Per-run analyst timeout in seconds"
        default: "540"
      retry_batch:
        description: >-
          Committed batch manifest path (records/thesis-analyst/batches/…)
          whose failed targets should be rerun against their original
          registrations. Within orphan grace only; skips selection and
          registration entirely. Overrides cadence/series/max_targets.
        default: ""
      retry_slugs:
        description: >-
          Optional comma-separated catalog slugs from retry_batch (default:
          every failed target in the manifest)
        default: ""

permissions:
  contents: read

concurrency:
  # One writer at a time across ALL docket loops (roll + prospect).
  group: docket-writers
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write # Sigstore attestation of records pushes
      attestations: write
    outputs:
      count: ${{ steps.targets.outputs.count }}
      batch: ${{ steps.targets.outputs.batch }}
      source_sha: ${{ steps.sync.outputs.source_sha || steps.targets.outputs.base_sha }}
      registration_commit: ${{ steps.sync.outputs.registration_commits }}
      target_content_hash: ${{ steps.sync.outputs.target_content_hashes }}
      registration_set_hash: ${{ steps.sync.outputs.registration_set_hash }}
      registration_artifact: ${{ steps.targets.outputs.registration_artifact }}
    steps:
      - uses: astral-sh/setup-uv@v5
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Adopt proven series into the registry
        # Skipped in retry mode: adoption writes docket_series.json, and
        # retry skips the commit steps — a pending adoption would leave a
        # dirty tree that aborts the sync step and burns the grace window.
        if: github.event.inputs.retry_batch == ''
        run: python3 scripts/adopt_proven_series.py

      - name: Compute targets with trusted repository code
        id: targets
        env:
          CADENCE: ${{ github.event.inputs.cadence }}
          SERIES: ${{ github.event.inputs.series }}
          MAX_TARGETS: ${{ github.event.inputs.max_targets || 10 }}
          RETRY_BATCH: ${{ github.event.inputs.retry_batch }}
          RETRY_SLUGS: ${{ github.event.inputs.retry_slugs }}
        run: |
          set -euo pipefail
          if [ -n "$RETRY_BATCH" ]; then
            # Retry mode: rebuild the trusted targets file from a committed
            # batch manifest (failed targets, within orphan grace). The
            # registrations already exist on main, so the registration
            # write steps are skipped below; the sync step's full
            # --bind-registration-commits pass still re-verifies every
            # target before generation.
            args=(
              python3 scripts/retry_batch_targets.py
              --batch "$RETRY_BATCH"
              --out /tmp/roll-targets.json
            )
            if [ -n "$RETRY_SLUGS" ]; then
              args+=(--slugs "$RETRY_SLUGS")
            fi
          else
            args=(
              python3 scripts/roll_docket.py
              --max-targets "$MAX_TARGETS"
              --out /tmp/roll-targets.json
            )
            if [ -n "$CADENCE" ]; then
              args+=(--cadence "$CADENCE")
            fi
            if [ -n "$SERIES" ]; then
              args+=(--series "$SERIES")
            fi
          fi
          "${args[@]}"
          COUNT=$(python3 -c "import json;print(len(json.load(open('/tmp/roll-targets.json'))['targets']))")
          DAY=$(date -u +%F)
          {
            echo "count=$COUNT"
            echo "batch=records/thesis-analyst/batches/$DAY/auto-roll-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}.json"
            echo "base_sha=$(git rev-parse HEAD)"
            echo "registration_artifact=roll-docket-registration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Create immutable target registrations
        # Skipped in retry mode: the targets already carry immutable
        # registrations on main (register() plans snapshot paths under
        # today's date, so a week-old registration would read as new).
        # The sync step's bind pass is the re-verification.
        if: steps.targets.outputs.count != '0' && github.event.inputs.retry_batch == ''
        run: |
          set -euo pipefail
          REGISTERED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 scripts/register_targets.py \
            --targets-file /tmp/roll-targets.json \
            --date "${REGISTERED_AT%%T*}" \
            --registered-at-utc "$REGISTERED_AT" \
            --skip-unbindable \
            --metadata-out /tmp/registration-before-commit.json

      - name: Commit trusted preregistration
        if: steps.targets.outputs.count != '0' && github.event.inputs.retry_batch == ''
        id: registration_commit
        run: |
          set -euo pipefail
          git config user.name "thesis-roller"
          git config user.email "recorder@thesisinstitute.org"
          git add records/targets/ site/src/data/ledger-targets.generated.ts scripts/docket_series.json
          if git diff --cached --quiet; then
            echo "committed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/docket_publication.py scan-staged
          git commit -m "Preregister auto-roll targets $(date -u +%F)"
          echo "committed=1" >> "$GITHUB_OUTPUT"

      - name: Synchronize, push, and bind registration commits
        if: steps.targets.outputs.count != '0'
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_helper="!f() { echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f"
          pushed=0
          for attempt in 1 2 3; do
            echo "registration push attempt $attempt"
            if [ -n "$(git status --porcelain)" ]; then
              echo "registration tree is dirty before rebase" >&2
              exit 1
            fi
            git pull --rebase origin main
            uv run --locked --extra custody python scripts/verify_record_chain.py records
            while IFS= read -r -d '' root; do
              python3 scripts/verify_custody.py "$(dirname "$root")"
            done < <(find records/thesis-analyst -name custody_root.json -type f -print0 | sort -z)
            # Re-run the complete registration binding under the rebased
            # trusted HEAD before it is allowed onto main. This verifies the
            # introducing commits, canonical snapshots, contracts, and exact
            # preregistration/finalized TS blocks after every race retry.
            python3 scripts/register_targets.py \
              --targets-file /tmp/roll-targets.json \
              --bind-registration-commits \
              --head HEAD \
              --metadata-out /tmp/registration-candidate.json
            LOCAL=$(git rev-parse HEAD)
            if git -c credential.helper= -c credential.helper="$auth_helper" push origin main; then
              REMOTE=$(git ls-remote origin refs/heads/main | awk '{print $1}')
              if [ "$REMOTE" = "$LOCAL" ]; then
                install -m 0644 \
                  /tmp/registration-candidate.json /tmp/registration.json
                pushed=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$pushed" != "1" ]; then
            echo "registration push did not converge after 3 attempts" >&2
            exit 1
          fi
          SET_HASH=$(python3 -c "import json;print(json.load(open('/tmp/registration.json'))['registrationSetHash'])")
          COMMITS=$(python3 -c "import json;print(json.dumps(json.load(open('/tmp/registration.json'))['registrationCommits'],separators=(',',':')))")
          HASHES=$(python3 -c "import json;print(json.dumps(json.load(open('/tmp/registration.json'))['targetContentHashes'],separators=(',',':')))")
          {
            echo "source_sha=$LOCAL"
            echo "registration_set_hash=$SET_HASH"
            echo "registration_commits=$COMMITS"
            echo "target_content_hashes=$HASHES"
          } >> "$GITHUB_OUTPUT"

      - name: Attest the registration push
        if: >-
          steps.registration_commit.outputs.committed == '1' &&
          steps.sync.outputs.source_sha != ''
        uses: ./.github/actions/attest-records-push
        with:
          commit: ${{ steps.sync.outputs.source_sha }}

      - name: Stage privileged target artifact
        if: steps.targets.outputs.count != '0'
        run: |
          set -euo pipefail
          mkdir -p /tmp/registered-targets
          install -m 0644 /tmp/roll-targets.json /tmp/registered-targets/roll-targets.json
          install -m 0644 /tmp/registration.json /tmp/registered-targets/registration.json

      - name: Upload privileged target artifact
        if: steps.targets.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.targets.outputs.registration_artifact }}
          path: /tmp/registered-targets/
          if-no-files-found: error
          retention-days: 7

  generate:
    if: ${{ needs.register.result == 'success' && needs.register.outputs.count != '0' }}
    needs: register
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      publication_artifact: ${{ steps.bundle.outputs.publication_artifact }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.register.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download privileged target artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.register.outputs.registration_artifact }}
          path: /tmp/trusted-registration

      - name: Verify the registered source ref
        env:
          EXPECTED_SHA: ${{ needs.register.outputs.source_sha }}
          EXPECTED_SET_HASH: ${{ needs.register.outputs.registration_set_hash }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 scripts/register_targets.py \
            --targets-file /tmp/trusted-registration/roll-targets.json \
            --bind-registration-commits \
            --head "$EXPECTED_SHA" \
            --metadata-out /tmp/generate-registration-check.json
          ACTUAL_SET_HASH=$(python3 -c "import json;print(json.load(open('/tmp/generate-registration-check.json'))['registrationSetHash'])")
          test "$ACTUAL_SET_HASH" = "$EXPECTED_SET_HASH"

      - uses: oven-sh/setup-bun@v2

      - name: Re-check retry grace before spending generation time
        # Advisory fail-fast (the trusted gate is --enforce-run-grace at
        # publication): re-running the selector here refuses the whole
        # batch if any target's grace lapsed between dispatch and this
        # job starting, instead of burning analyst runs that publication
        # will reject.
        if: github.event.inputs.retry_batch != ''
        env:
          RETRY_BATCH: ${{ github.event.inputs.retry_batch }}
          RETRY_SLUGS: ${{ github.event.inputs.retry_slugs }}
        run: |
          set -euo pipefail
          args=(
            python3 scripts/retry_batch_targets.py
            --batch "$RETRY_BATCH"
            --out /tmp/retry-grace-recheck.json
          )
          if [ -n "$RETRY_SLUGS" ]; then
            args+=(--slugs "$RETRY_SLUGS")
          fi
          "${args[@]}"

      - name: Enable unprivileged user namespaces for the agent sandbox
        if: ${{ github.event.inputs.codex_network == 'true' }}
        # Run 31607027862: every in-sandbox shell command died before
        # start with "bwrap: setting up uid map: Permission denied" on
        # the ubuntu-24.04 runner, so registered-query targets could not
        # execute their POST queries and dropped honestly (their failure
        # manifests carry the error). Codex's workspace-write sandbox is
        # bubblewrap, which needs unprivileged user namespaces. Probe
        # first, loosen the two known restrictions only if the probe
        # fails, and fail this job before burning analyst runs if a
        # namespace still cannot be created.
        run: |
          set -euo pipefail
          probe() { unshare --user --map-root-user true 2>/dev/null; }
          if probe; then echo "unprivileged user namespaces: ok"; exit 0; fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          if probe; then echo "unprivileged user namespaces: enabled via sysctl"; exit 0; fi
          echo "unprivileged user namespaces unavailable; the agent sandbox cannot run" >&2
          exit 1

      - name: Install codex CLI
        run: bun add -g @openai/codex@0.144.0

      - name: Authenticate codex
        run: printenv OPENAI_API_KEY | codex login --with-api-key

      - name: Run the analyst batch
        env:
          BATCH_MANIFEST: ${{ needs.register.outputs.batch }}
          PROMPT_MODE: ${{ github.event.inputs.prompt_mode || 'fast' }}
          THESIS_CODEX_MODEL: ${{ github.event.inputs.codex_model || '' }}
          CODEX_REASONING_EFFORT: ${{ github.event.inputs.codex_reasoning_effort || '' }}
          CODEX_NETWORK: ${{ github.event.inputs.codex_network || '' }}
          REVIEW_CODEX_MODEL: ${{ github.event.inputs.review_codex_model || '' }}
          REVIEW_CODEX_SEARCH: ${{ github.event.inputs.review_codex_search || '' }}
          TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds || '540' }}
        run: |
          set -euo pipefail
          args=(
            python3 scripts/run_thesis_batch.py
            --targets-file /tmp/trusted-registration/roll-targets.json
            --prompt-mode "$PROMPT_MODE"
            --timeout-seconds "$TIMEOUT_SECONDS"
            --out "$BATCH_MANIFEST"
          )
          if [ -n "$CODEX_REASONING_EFFORT" ]; then
            args+=(--codex-reasoning-effort "$CODEX_REASONING_EFFORT")
          fi
          if [ "$CODEX_NETWORK" = "true" ]; then
            args+=(--codex-sandbox workspace-write --codex-network)
          fi
          if [ -n "$REVIEW_CODEX_MODEL" ]; then
            args+=(--pre-submit-review-codex-model "$REVIEW_CODEX_MODEL")
          fi
          if [ "$REVIEW_CODEX_SEARCH" = "true" ]; then
            args+=(--pre-submit-review-codex-search)
          fi
          "${args[@]}" || true
          # Failures remain immutable run records; partial success is allowed.

      - name: Stage data-only publication bundle
        id: bundle
        env:
          BATCH_MANIFEST: ${{ needs.register.outputs.batch }}
        run: |
          python3 scripts/docket_publication.py stage \
            --bundle-dir /tmp/docket-publication \
            --batch "$BATCH_MANIFEST" \
            --trusted-targets /tmp/trusted-registration/roll-targets.json
          echo "publication_artifact=roll-docket-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload generated data bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.publication_artifact }}
          path: /tmp/docket-publication/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ always() }}
    needs: [register, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      actions: write # dispatches the recorder after publishing
      id-token: write # Sigstore attestation of records pushes
      attestations: write
    steps:
      - name: Propagate upstream failure
        if: >-
          needs.register.result != 'success' ||
          (needs.register.outputs.count != '0' && needs.generate.result != 'success')
        run: |
          echo "The register or unprivileged generation job failed" >&2
          exit 1

      - uses: astral-sh/setup-uv@v5
      - uses: actions/checkout@v5
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'

      - name: Download untrusted data bundle
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.generate.outputs.publication_artifact }}
          path: /tmp/docket-publication

      - name: Download privileged target artifact
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.register.outputs.registration_artifact }}
          path: /tmp/trusted-registration

      - name: Verify privileged target artifact and registration ancestry
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'
        env:
          EXPECTED_SET_HASH: ${{ needs.register.outputs.registration_set_hash }}
        run: |
          set -euo pipefail
          python3 scripts/register_targets.py \
            --targets-file /tmp/trusted-registration/roll-targets.json \
            --bind-registration-commits \
            --head HEAD \
            --metadata-out /tmp/publish-registration-check.json
          ACTUAL_SET_HASH=$(python3 -c "import json;print(json.load(open('/tmp/publish-registration-check.json'))['registrationSetHash'])")
          test "$ACTUAL_SET_HASH" = "$EXPECTED_SET_HASH"

      - name: Validate then apply the data bundle
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'
        env:
          BATCH_MANIFEST: ${{ needs.register.outputs.batch }}
          RETRY_BATCH: ${{ github.event.inputs.retry_batch }}
        run: |
          VALIDATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          args=(
            python3 scripts/docket_publication.py validate
            --bundle-dir /tmp/docket-publication
            --batch "$BATCH_MANIFEST"
            --trusted-targets /tmp/trusted-registration/roll-targets.json
            --publish-validated-at-utc "$VALIDATED_AT"
            --allow-published-wave
            --apply
          )
          if [ -n "$RETRY_BATCH" ]; then
            # Trusted grace gate: a retried run that started or sealed
            # after its registration's orphan grace deadline is refused
            # here regardless of what selection approved earlier.
            args+=(--enforce-run-grace)
          fi
          "${args[@]}"

      - name: Verify complete record chain and custody graph
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'
        run: |
          set -euo pipefail
          uv run --locked --extra custody python scripts/verify_record_chain.py records
          while IFS= read -r -d '' root; do
            python3 scripts/verify_custody.py "$(dirname "$root")"
          done < <(find records/thesis-analyst -name custody_root.json -type f -print0 | sort -z)

      - name: Regenerate publication TypeScript with trusted code
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'
        id: publish
        env:
          BATCH_MANIFEST: ${{ needs.register.outputs.batch }}
        run: |
          set -euo pipefail
          DAY=$(basename "$(dirname "$BATCH_MANIFEST")")
          WAVE_HASH=$(shasum -a 256 "$BATCH_MANIFEST" | awk '{print $1}')
          if python3 scripts/register_wave.py \
              --name "auto-$DAY-$WAVE_HASH" \
              --batch "$BATCH_MANIFEST" \
              --allow-missing; then
            echo "published=1" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" = "2" ]; then
              echo "published=0" >> "$GITHUB_OUTPUT"
            else
              exit "$code"
            fi
          fi

      - name: Test regenerated site
        if: steps.publish.outputs.published == '1'
        run: |
          cd site
          bun install --frozen-lockfile
          bun run test
          bun run build

      - name: Commit records and trusted generated publication
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'
        id: commit
        run: |
          set -euo pipefail
          git config user.name "thesis-roller"
          git config user.email "recorder@thesisinstitute.org"
          git add records/thesis-analyst/ site/src/data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "publication is already present at $(git rev-parse HEAD)"
            echo "committed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/docket_publication.py scan-staged
          git commit -m "Auto-roll the docket $(date -u +%F)"
          echo "committed=1" >> "$GITHUB_OUTPUT"

      - name: Rebase, reverify, and push once
        id: final_push
        if: steps.commit.outputs.committed == '1'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_MANIFEST: ${{ needs.register.outputs.batch }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
          EXPECTED_SET_HASH: ${{ needs.register.outputs.registration_set_hash }}
        run: |
          set -euo pipefail
          auth_helper="!f() { echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f"
          pushed=0
          for attempt in 1 2 3; do
            echo "publication push attempt $attempt"
            if [ -n "$(git status --porcelain)" ]; then
              echo "publication tree is dirty before rebase" >&2
              exit 1
            fi
            git pull --rebase origin main
            # A rebase can absorb docket changes (anchors included) that
            # landed after the initial publish bind. Re-run the complete
            # registration binding at the rebased HEAD and require the
            # identical registration set, exactly as the register job's
            # sync loop does — a mid-flight docket change fails the push
            # closed instead of publishing against stale trusted context.
            python3 scripts/register_targets.py \
              --targets-file /tmp/trusted-registration/roll-targets.json \
              --bind-registration-commits \
              --head HEAD \
              --metadata-out /tmp/final-registration-check.json
            FINAL_SET_HASH=$(python3 -c "import json;print(json.load(open('/tmp/final-registration-check.json'))['registrationSetHash'])")
            test "$FINAL_SET_HASH" = "$EXPECTED_SET_HASH"
            DAY=$(basename "$(dirname "$BATCH_MANIFEST")")
            WAVE_HASH=$(shasum -a 256 "$BATCH_MANIFEST" | awk '{print $1}')
            WAVE_NAME="auto-$DAY-$WAVE_HASH"
            if python3 scripts/register_wave.py \
                --name "$WAVE_NAME" \
                --batch "$BATCH_MANIFEST" \
                --allow-missing; then
              :
            else
              code=$?
              if [ "$code" != "2" ]; then
                exit "$code"
              fi
            fi
            # A rebase may introduce a competing slug or change trusted
            # generator code. The rebased commit must already be the exact
            # deterministic output of the trusted generators at final HEAD.
            git diff --exit-code
            git diff --cached --exit-code
            VALIDATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            python3 scripts/docket_publication.py validate \
              --bundle-dir /tmp/docket-publication \
              --batch "$BATCH_MANIFEST" \
              --trusted-targets /tmp/trusted-registration/roll-targets.json \
              --publish-validated-at-utc "$VALIDATED_AT" \
              --allow-published-wave
            uv run --locked --extra custody python scripts/verify_record_chain.py records
            while IFS= read -r -d '' root; do
              python3 scripts/verify_custody.py "$(dirname "$root")"
            done < <(find records/thesis-analyst -name custody_root.json -type f -print0 | sort -z)
            if [ "$PUBLISHED" = "1" ]; then
              (
                cd site
                bun install --frozen-lockfile
                bun run test
                bun run build
              )
            fi
            if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
              echo "nothing of ours survived the rebase; refusing a no-op push" >&2
              exit 1
            fi
            LOCAL=$(git rev-parse HEAD)
            if git -c credential.helper= -c credential.helper="$auth_helper" push origin main; then
              REMOTE=$(git ls-remote origin refs/heads/main | awk '{print $1}')
              if [ "$REMOTE" = "$LOCAL" ]; then
                pushed=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$pushed" != "1" ]; then
            echo "publication push did not converge after 3 attempts" >&2
            exit 1
          fi
          echo "attest_commit=$LOCAL" >> "$GITHUB_OUTPUT"

      - name: Attest the publication push
        if: steps.final_push.outputs.attest_commit != ''
        uses: ./.github/actions/attest-records-push
        with:
          commit: ${{ steps.final_push.outputs.attest_commit }}

      - name: Stamp the record
        if: steps.commit.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_DEPLOY_HOOK_URL: ${{ secrets.MANUAL_DEPLOY_HOOK_URL }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          if [ "$PUBLISHED" != "1" ]; then
            # A failed-only batch has no new live forecast surface and may not
            # trigger a Vercel deployment. The recorder's scheduled-mode path
            # accepts the deployed build as an ancestor while attesting this
            # exact current main checkout and its registration/run records.
            gh workflow run record-forecasts.yml --ref main
            exit 0
          fi
          GOT=""
          for i in $(seq 1 24); do
            GOT=$(curl -sf https://app.thesisinstitute.org/build.json \
              | python3 -c 'import json,sys;print(json.load(sys.stdin).get("commit",""))' \
              2>/dev/null || true)
            [ "$GOT" = "$SHA" ] && break
            if [ "$i" = "12" ] && [ -n "$MANUAL_DEPLOY_HOOK_URL" ]; then
              curl -sf -X POST "$MANUAL_DEPLOY_HOOK_URL" > /dev/null || true
            fi
            sleep 30
          done
          if [ "$GOT" != "$SHA" ]; then
            echo "production never reached $SHA (canary shows: $GOT)" >&2
            exit 1
          fi
          gh workflow run record-forecasts.yml --ref main -f expected_sha="$SHA"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Docket roll failed $(date -u +%F)"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
          if [ -z "$existing" ]; then
            gh issue create --title "$title" \
              --body "The auto-roll loop failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          fi
