name: CI

on:
  push:
    branches: [main, brier-migration]
  pull_request:
    branches: [main, brier-migration]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NEXT_PUBLIC_SITE_ASSET_REV: ${{ github.sha }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: site

      - name: Type check
        run: bunx tsc -b
        working-directory: site

      - name: Test
        run: bun run test
        working-directory: site

      - name: Build
        run: bun run build
        working-directory: site

  forecast-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: forecast-api

      - name: Type check
        run: bun run typecheck
        working-directory: forecast-api

      - name: Build
        run: bun run build
        working-directory: forecast-api

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install package with all extras
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest tests/ -q

  wave-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify immutable record chain
        run: python3 scripts/verify_record_chain.py records

      - name: Regenerate newest custody-era wave
        run: python3 scripts/verify_wave_reproducibility.py

  packaged-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Smoke test built artifact
        run: python scripts/smoke_packaged_install.py dist/*.whl
