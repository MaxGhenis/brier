name: CI

on:
  push:
    branches: [main, brier-migration]
  pull_request:
    branches: [main, brier-migration]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NEXT_PUBLIC_SITE_ASSET_REV: ${{ github.sha }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: site

      - name: Type check
        run: bunx tsc -b
        working-directory: site

      - name: Test
        run: bun run test
        working-directory: site

      - name: Build
        run: bun run build
        working-directory: site

      - name: Alert on main failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="CI failed on main $(date -u +%F)"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
          if [ -z "$existing" ]; then
            gh issue create --title "$title" \
              --body "CI is red on main: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}. Production deploys fail alongside — the site canary stays pinned to the last green build until this is fixed (2026-07-18 to 2026-07-20 outage class)."
          fi

      - name: Enforce generated-site size budgets
        run: bun run check:size-budgets
        working-directory: site

  forecast-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: forecast-api

      - name: Type check
        run: bun run typecheck
        working-directory: forecast-api

      - name: Build
        run: bun run build
        working-directory: forecast-api

  python-tests:
    runs-on: ubuntu-latest
    steps:
      # Full history: the chain verifier binds the genesis enumeration to its
      # source commit's Git tree, which a depth-1 checkout does not contain.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install package with all extras
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest tests/ -q

  wave-reproducibility:
    runs-on: ubuntu-latest
    steps:
      # Full history for the same genesis-enumeration Git binding as above.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify immutable record chain
        run: python3 scripts/verify_record_chain.py records

      - name: Regenerate newest custody-era wave
        run: python3 scripts/verify_wave_reproducibility.py

  packaged-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Smoke test built artifact
        run: python scripts/smoke_packaged_install.py dist/*.whl
